<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificación - {{app_name}}</title>
    <style>
        body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f4f6f8; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #53abc1 0%, #006b8f 100%); padding: 25px 20px; text-align: center; }
        .header img { max-width: 200px; height: auto; border-radius: 8px; }
        .header h1 { color: #ffffff; font-size: 22px; font-weight: 700; margin: 12px 0 0 0; }
        .content { padding: 30px; }
        .content p { color: #555555; font-size: 15px; margin-bottom: 16px; }
        .button { display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #53abc1 0%, #006b8f 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; margin: 10px 0; }
        .footer { text-align: center; padding: 20px; color: #888; font-size: 12px; background-color: #f4f6f8; border-top: 1px solid #e8ecef; }
        .footer p { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{logo_url}}" alt="{{app_name}}">
            <h1>Notificación</h1>
        </div>
        
        <div class="content">
            
        </div>
        
        <div class="footer">
            <p>Este es un email automático de {{app_name}}.</p>
            <p>&copy; {{current_year}} {{app_name}}. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
